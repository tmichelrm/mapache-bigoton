spring.application.name=barberia-api
server.port=8080

# Datos de conexión a MySQL.
# El usuario y la contraseña reales van en application-local.properties (no se sube a GitHub).
spring.datasource.url=jdbc:mysql://localhost:3306/BarberiaDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./application-local.properties

# Las tablas ya se crean con el script SQL; Hibernate no debe tocarlas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Mostrar el mensaje de los errores (útil para depurar)
server.error.include-message=always

# Origen del frontend permitido (React con Vite)
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173
